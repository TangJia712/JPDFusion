[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "jpdfusion"
version = "1.0.0"
description = "Reproducible Gaussian-copula spatiotemporal fusion of single-band HLS with SAR or MCD43A4"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [{name = "JPDFusion authors"}]
dependencies = [
  "numpy>=1.24,<3",
  "scipy>=1.10,<2",
  "rasterio>=1.3.9,<2",
  "scikit-learn>=1.3,<2",
  "PyYAML>=6.0,<7",
]

[project.optional-dependencies]
dev = ["pytest>=7.4,<9"]

[project.scripts]
jpdfusion = "jpdfusion.cli:main"

[tool.setuptools.packages.find]
include = ["jpdfusion*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

